<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="manifest.json">
<title>Weather Radar System</title>

<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: "Segoe UI", sans-serif;
}

/* =======================
   DARK MODE THEME
======================= */
body.dark-mode {
  background: #020617;
  color: #e5e7eb;
}

#map {
  height: 100vh;
  width: 100%;
}

/* Top info bar */
.update-info {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #0f172a, #020617);
  color: #93c5fd;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 14px;
  z-index: 1000;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

/* Leaflet controls */
.dark-mode .leaflet-control {
  background: rgba(15, 23, 42, 0.95);
  color: #e5e7eb;
  border: 1px solid #1e40af;
}

.dark-mode .leaflet-control a {
  color: #93c5fd;
}

/* Radar smooth */
.leaflet-layer {
  transition: opacity 0.4s ease;
}
</style>
</head>

<body class="dark-mode">

<div id="map"></div>
<div class="update-info" id="updateInfo">⏳ กำลังโหลดเรดาร์...</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =======================
   MAP INIT (DARK MODE)
======================= */
const darkMap = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  {
    attribution: "&copy; CARTO",
    subdomains: "abcd",
    maxZoom: 19
  }
);

const map = L.map("map", {
  center: [17.4, 102.8], // Thailand
  zoom: 7,
  layers: [darkMap]
});

/* =======================
   RAINVIEWER RADAR
   Universal Blue
======================= */
let rainLayer = null;
let currentTime = null;

/* Fetch latest radar timestamp */
async function fetchRainviewerTime() {
  const res = await fetch("https://api.rainviewer.com/public/weather-maps.json");
  const data = await res.json();
  return data.radar.past[data.radar.past.length - 1].time;
}

/* Update radar without reload */
function updateRadar(time) {
  if (rainLayer) {
    map.removeLayer(rainLayer);
  }

  rainLayer = L.tileLayer(
    `https://tilecache.rainviewer.com/v2/radar/${time}/256/{z}/{x}/{y}/2/1_1.png`,
    {
      opacity: 0.8,
      zIndex: 400
    }
  );

  rainLayer.addTo(map);
  currentTime = time;

  const date = new Date(time * 1000);
  document.getElementById("updateInfo").innerText =
    "📡 Radar update: " + date.toLocaleString("th-TH");
}

/* =======================
   INITIAL LOAD
======================= */
fetchRainviewerTime().then(time => {
  updateRadar(time);
});

/* =======================
   AUTO UPDATE (5 MIN)
   Background only
======================= */
setInterval(async () => {
  const newTime = await fetchRainviewerTime();
  if (newTime !== currentTime) {
    updateRadar(newTime);
  }
}, 300000); // 5 minutes
</script>

</body>
</html>
